<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG</title>
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    html, body { margin: 0; }
    .card {
      width: 1200px; height: 630px;
      background: #f3eee4;
      color: #1c1712;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      padding: 64px 72px;
      box-sizing: border-box;
      font-family: Literata, Georgia, serif;
    }
    h1 { font-family: Fraunces, Georgia, serif; font-size: 92px; line-height: 0.86; margin: 0; letter-spacing: -0.045em; font-weight: 680; }
    h1 em { font-style: italic; color: #b43322; font-weight: 560; }
    p { font-family: Fraunces, Georgia, serif; font-size: 34px; line-height: 1.15; max-width: 16ch; font-weight: 560; }
    .kicker { font-family: "DM Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; font-size: 16px; color: #6f675e; }
    .slip { border: 2px solid #1c1712; background: #faf6ee; padding: 28px; transform: rotate(-3deg); align-self: center; }
    .seal { width: 180px; height: 180px; border: 3px solid #b43322; color: #b43322; border-radius: 50%; display: grid; place-items: center; text-align: center; font-family: "DM Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; font-size: 14px; margin-left: auto; transform: rotate(8deg); }
    .seal b { display: block; font-family: Fraunces, Georgia, serif; font-size: 22px; letter-spacing: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <p class="kicker">Slip no. 016 · Long Beach</p>
      <h1>Bhavaani<br><em>Kamesh</em></h1>
      <p>AI that has to show its work before anything is allowed to move.</p>
    </div>
    <div class="slip">
      <div class="seal"><span>Held<br><b>by a person</b><br>not the model</span></div>
    </div>
  </div>
</body>
</html>
